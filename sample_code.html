<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Website</h1>
        <p>This is a simple sample HTML page containing basic structural elements.</p>
        
        <h2>Features</h2>
        <ul>
            <li>HTML5 Semantic Tags</li>
            <li>Embedded CSS Styling</li>
            <li>Basic Interactive Elements</li>
        </ul>

        <p>Visit <a href="https://github.com" target="_blank">GitHub</a> to store your code online.</p>
        
        <button onclick="alert('Hello from HTML!')">Click Me</button>
    </div>

</body>
</html>
